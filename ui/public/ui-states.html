<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CogMyra UI States</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0d1b2a;
            color: #e0e1dd;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 1.5rem;
        }

        .state {
            background: #1b263b;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            min-width: 260px;
            text-align: center;
            transition: all .3s ease;
        }

        .hidden {
            display: none;
        }

        .spinner {
            border: 4px solid #1b263b;
            border-top: 4px solid #93c5fd;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        button {
            margin-top: 1rem;
            padding: .5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #415a77;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #778da9;
        }
    </style>
</head>

<body>
    <div id="loading" class="state">
        <div class="spinner"></div>
        <p>Loading, please wait...</p>
    </div>

    <div id="empty" class="state hidden">
        <p>No content yet.<br />Start your first session to see results here.</p>
    </div>

    <div id="error" class="state hidden">
        <p>⚠️ Something went wrong.<br />Please try again.</p>
        <button id="retry">Retry</button>
    </div>

    <script>
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function simulate() {
            show('loading');
            await delay(1500);

            // Randomize for demo
            const roll = Math.random();
            if (roll < .33) show('empty');
            else if (roll < .66) show('error');
            else show('loading');
        }

        function show(id) {
            ['loading', 'empty', 'error'].forEach(s =>
                document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        document.getElementById('retry').addEventListener('click', simulate);

        simulate();
    </script>
</body>

</html>
